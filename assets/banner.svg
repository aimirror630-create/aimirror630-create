<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="MIRROR — Цифровое бессмертие. Голос. Навсегда.">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#001a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0"/>
      <stop offset="70%" stop-color="#00FF41" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#CFFFD1" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="rgba(0,255,65,0.04)"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- matrix rain columns (static) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="url(#col)" opacity="0.9">
    <text x="40"   y="24">0</text><text x="40"   y="46">1</text><text x="40"   y="68">ア</text><text x="40"   y="90">{</text><text x="40"  y="112">#</text><text x="40"  y="134">7</text><text x="40"  y="156">ナ</text>
    <text x="95"   y="30">ミ</text><text x="95"   y="52">3</text><text x="95"   y="74">9</text><text x="95"   y="96">·</text><text x="95"  y="118">ラ</text><text x="95"  y="140">0</text>
    <text x="150"  y="18">サ</text><text x="150"  y="40">ュ</text><text x="150"  y="62">0</text><text x="150"  y="84">1</text><text x="150" y="106">ー</text><text x="150" y="128">4</text><text x="150" y="150">ワ</text><text x="150" y="172">1</text>
    <text x="205"  y="34">¥</text><text x="205"  y="56">5</text><text x="205"  y="78">π</text><text x="205" y="100">2</text><text x="205" y="122">∞</text>
    <text x="260"  y="22">0</text><text x="260"  y="44">0</text><text x="260"  y="66">セ</text><text x="260"  y="88">1</text><text x="260" y="110">0</text><text x="260" y="132">1</text><text x="260" y="154">0</text>
    <text x="315"  y="28">K</text><text x="315"  y="50">8</text><text x="315"  y="72">2</text><text x="315"  y="94">ニ</text><text x="315" y="116">9</text>
    <text x="1025" y="20">¥</text><text x="1025" y="42">0</text><text x="1025" y="64">§</text><text x="1025" y="86">1</text><text x="1025" y="108">ル</text><text x="1025" y="130">0</text>
    <text x="1080" y="32">7</text><text x="1080" y="54">ソ</text><text x="1080" y="76">3</text><text x="1080" y="98">@</text><text x="1080" y="120">1</text><text x="1080" y="142">0</text><text x="1080" y="164">ド</text>
    <text x="1135" y="16">1</text><text x="1135" y="38">ミ</text><text x="1135" y="60">0</text><text x="1135" y="82">ス</text><text x="1135" y="104">8</text><text x="1135" y="126">∞</text><text x="1135" y="148">1</text>
  </g>

  <!-- bottom rain -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="url(#col)" opacity="0.75">
    <text x="70"   y="230">0</text><text x="70"   y="252">1</text><text x="70"   y="274">セ</text><text x="70"   y="296">∞</text><text x="70"  y="318">1</text>
    <text x="130"  y="218">ミ</text><text x="130"  y="240">3</text><text x="130"  y="262">ラ</text><text x="130" y="284">0</text><text x="130" y="306">1</text>
    <text x="1050" y="226">K</text><text x="1050" y="248">8</text><text x="1050" y="270">0</text><text x="1050" y="292">1</text>
    <text x="1110" y="216">9</text><text x="1110" y="238">ニ</text><text x="1110" y="260">π</text><text x="1110" y="282">0</text><text x="1110" y="304">∞</text>
  </g>

  <!-- scanlines overlay -->
  <rect width="1200" height="340" fill="url(#scan)" opacity="0.6"/>

  <!-- main title -->
  <g filter="url(#glow)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, 'Courier New', monospace">
    <text x="600" y="175" font-size="96" font-weight="700" letter-spacing="14" fill="#00FF41">MIRROR</text>
  </g>

  <!-- underline -->
  <line x1="420" y1="200" x2="780" y2="200" stroke="#00FF41" stroke-width="1" opacity="0.55"/>

  <!-- tagline -->
  <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="600" y="232" font-size="20" letter-spacing="6" fill="#CFFFD1" opacity="0.9">ЦИФРОВОЕ  БЕССМЕРТИЕ  ·  ГОЛОС  ·  НАВСЕГДА</text>
    <text x="600" y="262" font-size="13" letter-spacing="3" fill="#00FF41" opacity="0.75">mirror-ai.app  //  живое демо: /matrix/</text>
  </g>

  <!-- corner brackets -->
  <g stroke="#00FF41" stroke-width="2" fill="none" opacity="0.9">
    <polyline points="20,20 20,60 60,60" transform="translate(0,0)"/>
    <polyline points="60,20 20,20" transform="translate(0,0)"/>
    <polyline points="1140,20 1180,20 1180,60"/>
    <polyline points="20,320 20,280 60,280"/>
    <polyline points="1180,320 1180,280 1140,280"/>
  </g>

  <!-- status dot -->
  <circle cx="36" cy="36" r="3" fill="#00FF41"/>
  <text x="48" y="40" font-family="ui-monospace, monospace" font-size="11" fill="#00FF41" opacity="0.75" letter-spacing="2">ONLINE</text>
</svg>
